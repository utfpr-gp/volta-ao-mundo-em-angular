<section class="rounded-card border border-line bg-card p-5 text-ink shadow-sm">
  <h2 class="mb-3 text-xl font-extrabold"><span aria-hidden="true">📊</span> Dias fora de casa, por ano</h2>
  <!-- O canvas é só desenho: quem usa leitor de tela recebe a mesma informação na tabela. -->
  <div class="relative h-64">
    <canvas #canvas aria-hidden="true"></canvas>
  </div>
  <table data-chart-table class="sr-only">
    <caption>Dias fora de casa, por ano</caption>
    <thead>
      <tr><th scope="col">Ano</th><th scope="col">Dias</th></tr>
    </thead>
    <tbody>
      @for (row of years(); track row.year) {
        <tr><td>{{ row.year }}</td><td>{{ row.days }}</td></tr>
      }
    </tbody>
  </table>
</section>
