<a routerLink="/paises" class="text-sm font-bold text-ink-muted hover:text-ink">← Todos os países</a>

@if (country(); as country) {
  <article class="mt-4 max-w-2xl rounded-card border border-line bg-card text-ink shadow-sm">
    <header class="flex flex-wrap items-center gap-4 p-6 pb-4">
      <span class="text-5xl" aria-hidden="true">{{ country.code | flag }}</span>
      <h1 class="text-3xl font-extrabold">{{ country.name }}</h1>
      <button type="button" class="ml-auto rounded-full bg-primary px-4 py-2 text-sm font-bold text-on-primary" (click)="drawAnother()">
        🎲 Sortear outro destino
      </button>
    </header>

    <nav aria-label="Seções do país" class="flex gap-1 overflow-x-auto border-b border-line px-4 text-ink-muted">
      @for (tab of tabs; track tab.path) {
        <a
          [routerLink]="tab.path"
          routerLinkActive="text-ink"
          ariaCurrentWhenActive="page"
          class="-mb-px shrink-0 border-b-[3px] border-transparent px-3 py-2 font-bold hover:text-ink aria-[current=page]:border-highlight"
        >
          {{ tab.label }}
        </a>
      }
    </nav>

    <div class="p-6">
      <router-outlet />
    </div>
  </article>
} @else {
  <section class="mt-4 max-w-xl rounded-card border border-dashed border-line bg-card p-6 text-ink">
    <h1 class="text-2xl font-extrabold">Não encontramos o país {{ code() }}</h1>
    <p class="mt-2 text-ink-muted">Confira o código no endereço: são duas letras, como BR ou JP.</p>
  </section>
}
