<a routerLink="/paises" class="text-sm font-bold text-ink-muted hover:text-ink">← Todos os países</a>

@if (country(); as country) {
  <article class="mt-4 max-w-xl rounded-card border border-line bg-card p-6 text-ink shadow-sm">
    <p class="text-6xl" aria-hidden="true">{{ country.code | flag }}</p>
    <h1 class="mt-3 text-3xl font-extrabold">{{ country.name }}</h1>
    <p class="mt-1 text-ink-muted">Capital: {{ country.capital }} · código {{ country.code }}</p>
    <button type="button" class="mt-5 rounded-full bg-primary px-5 py-2 font-bold text-on-primary" (click)="drawAnother()">
      🎲 Sortear outro destino
    </button>
  </article>
} @else {
  <section class="mt-4 max-w-xl rounded-card border border-dashed border-line bg-card p-6 text-ink">
    <h1 class="text-2xl font-extrabold">Não encontramos o país {{ code() }}</h1>
    <p class="mt-2 text-ink-muted">Confira o código no endereço: são duas letras, como BR ou JP.</p>
  </section>
}
