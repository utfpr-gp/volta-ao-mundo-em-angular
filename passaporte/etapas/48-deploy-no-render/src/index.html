<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Passaporte</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="O Passaporte guarda os países que você já visitou e os que quer conhecer, com um diário de viagens e um carimbo para cada país." />
    <!-- As tags que não mudam de página para página. As que mudam (título, descrição, endereço, imagem) vêm do SeoTitleStrategy. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Passaporte" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- O PWA: o manifesto diz nome, ícones e cores do app instalado; a cor do tema pinta a barra do navegador. -->
    <link rel="manifest" href="manifest.webmanifest" /> <!-- [!code highlight] -->
    <meta name="theme-color" content="#12263a" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>O Passaporte precisa do JavaScript ligado no navegador.</noscript>
  </body>
</html>
