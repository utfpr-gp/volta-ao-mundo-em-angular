<header class="bg-primary px-4 py-3 text-on-primary sm:px-6">
  <div class="mx-auto flex max-w-6xl items-center justify-between">
    <a routerLink="/paises" class="flex items-center gap-2 text-xl font-extrabold">
      <svg aria-hidden="true" viewBox="0 0 24 24" class="size-7 text-highlight" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="9" />
        <path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" />
      </svg>
      {{ appName }}
    </a>

    <!-- No celular: um botão que abre e fecha o menu. Some a partir de md. -->
    <button
      type="button"
      class="rounded-lg px-3 py-1.5 font-bold md:hidden"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="menu-principal"
      (click)="menuOpen.update((open) => !open)"
    >
      {{ menuOpen() ? '✕ Fechar' : '☰ Menu' }}
    </button>

    <!-- A partir de md: os links sempre à vista, lado a lado. -->
    <nav class="hidden gap-4 text-on-primary-muted md:flex">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="font-bold text-on-primary"
          ariaCurrentWhenActive="page"
          class="hover:text-on-primary"
        >
          {{ link.label }}
        </a>
      }
      <!-- A conta: quem não entrou vê "Entrar"; quem entrou vê o e-mail e "Sair". -->
      @if (auth.user(); as user) {
        <span data-account class="max-w-48 truncate text-on-primary" [title]="user.email">{{ user.email }}</span>
        <button type="button" class="font-bold text-on-primary hover:underline" (click)="signOut()">Sair</button>
      } @else {
        <a routerLink="/entrar" routerLinkActive="font-bold text-on-primary" ariaCurrentWhenActive="page" class="hover:text-on-primary">
          Entrar
        </a>
      }
    </nav>
  </div>

  @if (menuOpen()) {
    <nav id="menu-principal" class="mt-3 flex flex-col gap-2 border-t border-primary-soft pt-3 text-on-primary-muted md:hidden">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="font-bold text-on-primary"
          ariaCurrentWhenActive="page"
          class="hover:text-on-primary"
          (click)="menuOpen.set(false)"
        >
          {{ link.label }}
        </a>
      }
      @if (auth.user(); as user) {
        <span class="truncate text-on-primary">{{ user.email }}</span>
        <button type="button" class="text-left font-bold text-on-primary" (click)="signOut()">Sair</button>
      } @else {
        <a routerLink="/entrar" class="hover:text-on-primary" (click)="menuOpen.set(false)">Entrar</a>
      }
    </nav>
  }
</header>
