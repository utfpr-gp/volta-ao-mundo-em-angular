# Roda os testes e o build a cada push na main e a cada pull request. O Render só publica quando tudo passa.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build
