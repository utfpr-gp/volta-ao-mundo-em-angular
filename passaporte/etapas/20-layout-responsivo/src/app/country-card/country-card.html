<article class="flex items-center gap-3 rounded-card border border-line bg-card px-4 py-3 shadow-sm">
  <span class="w-5 font-bold text-ink-muted">{{ position() }}</span>
  <span class="text-3xl">{{ country().code | flag }}</span>
  <div>
    <strong class="block text-ink">{{ country().name }}</strong>
    <span class="text-sm text-ink-muted">{{ country().capital }}</span>
  </div>
  <button
    type="button"
    class="ml-auto rounded-full border border-line px-3 py-1 text-sm font-bold text-ink"
    (click)="toggled.emit(country().code)"
  >
    {{ country().visited ? 'Visitado ✓' : 'Visitar' }}
  </button>
  <button
    type="button"
    class="rounded-full px-2 py-1 font-extrabold text-stamp hover:bg-stamp/10"
    [attr.aria-label]="'Remover ' + country().name"
    (click)="removed.emit(country().code)"
  >
    ✕
  </button>
</article>
