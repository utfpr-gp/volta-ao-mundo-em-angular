# A demonstração do Passaporte publicada pelo livro (capítulo 48). Quem lê usa o render.yaml da etapa, na raiz do próprio
# repositório; aqui a etapa mora numa subpasta do livro, por isso o rootDir.
services:
  - type: web
    runtime: static
    name: passaporte-volta-ao-mundo
    rootDir: passaporte/etapas/48-deploy-no-render
    buildCommand: npm ci && npm run build && cd dist/passaporte/browser && cp sobre/index.html teste.html && mkdir teste2 && cp sobre/index.html teste2/index.html
    staticPublishPath: dist/passaporte/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.csr.html
