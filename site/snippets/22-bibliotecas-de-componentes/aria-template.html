<ul
  ngListbox
  orientation="horizontal"
  selectionMode="follow"
  [(value)]="selected"
  aria-label="Filtrar países"
  class="flex gap-2"
>
  @for (option of options; track option) {
    <li
      ngOption
      [value]="option"
      [label]="option"
      class="cursor-pointer rounded-full border border-stone-400 px-4 py-1.5 font-bold aria-selected:border-amber-500 aria-selected:bg-amber-400"
    >
      {{ option }}
    </li>
  }
</ul>
<p class="mt-3 text-stone-600">Mostrando: {{ selected()[0] }}</p>
