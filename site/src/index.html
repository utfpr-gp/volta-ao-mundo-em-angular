<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Volta ao Mundo em Angular</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12263A">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Aplica o tema antes do Angular, para a página não piscar no modo errado.
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('vmea:theme'); } catch (e) {}
      var dark = stored === 'dark' ||
        (stored !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <vm-root></vm-root>
</body>
</html>
