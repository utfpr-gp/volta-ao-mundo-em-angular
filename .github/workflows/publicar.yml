name: Verificar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Testes, build e verificações
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Testes (Vitest e scripts)
        run: npm test
      - name: Build do site, 404, sitemap e índice da busca
        run: npm run build
      - name: Contraste, saída gerada e links internos
        run: npm run check
      - name: Build das etapas do Passaporte
        run: node scripts/build-stages.mjs
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist/site/browser

  publicar:
    name: Publicar no GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Eventos de push podem chegar atrasados; uma execução de um commit antigo não pode
      # publicar por cima de uma versão mais nova. Só publica se este commit ainda for o topo da main.
      - name: Conferir se é a versão mais recente da main
        id: latest
        run: |
          head=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          if [ "$head" = "${{ github.sha }}" ]; then echo "current=yes" >> "$GITHUB_OUTPUT"; else echo "current=no" >> "$GITHUB_OUTPUT"; echo "Commit antigo (${{ github.sha }}); a main está em $head. Nada a publicar."; fi
      - id: deploy
        if: steps.latest.outputs.current == 'yes'
        uses: actions/deploy-pages@v4
