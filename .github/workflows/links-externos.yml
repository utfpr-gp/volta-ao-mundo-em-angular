name: Links externos

# Os links para fora (angular.dev, MDN, etc.) mudam sem aviso. Uma vez por semana,
# o site é gerado e todos os links são conferidos, inclusive os externos.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-links.mjs --externos
