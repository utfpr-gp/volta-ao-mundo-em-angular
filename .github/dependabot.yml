version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@schematics/angular'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
      ferramentas:
        patterns:
          - 'shiki'
          - '@shikijs/*'
          - 'pagefind'
          - 'linkinator'
          - 'vitest'
          - 'jsdom'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
